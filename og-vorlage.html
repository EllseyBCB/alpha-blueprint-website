<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<!-- Vorlage für og-image.jpg. Nicht verlinkt, nicht in der Sitemap.
     Neu erzeugen: Seite bei 1200x630 aufnehmen und als og-image.jpg speichern. -->
<link rel="stylesheet" href="fonts.css?v=7">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:"Manrope",Arial,sans-serif;color:#e6f3f9;
    background:
      radial-gradient(70% 90% at 82% 8%, rgba(57,217,245,.20), transparent 62%),
      radial-gradient(60% 70% at 8% 96%, rgba(26,125,150,.20), transparent 66%),
      linear-gradient(160deg,#071018 0%,#05090e 60%,#030609 100%);
    position:relative}
  .netz{position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(57,217,245,.035) 3px 4px)}
  .rahmen{position:absolute;inset:26px;border:1px solid rgba(57,217,245,.22);border-radius:22px}
  .inhalt{position:relative;padding:70px 84px 104px;height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:center}
  img{width:118px;height:auto;margin-bottom:34px}
  .augenbraue{font-size:19px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
    color:#39d9f5;margin:0 0 20px;display:flex;align-items:center;gap:14px}
  .augenbraue::before{content:"";width:42px;height:2px;background:#39d9f5}
  h1{margin:0 0 20px;font-size:72px;line-height:1.02;letter-spacing:-.035em;font-weight:800}
  h1 span{background:linear-gradient(100deg,#a8ecfa,#39d9f5 55%,#1a7d96);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0;font-size:26px;line-height:1.5;color:#8aa3b2;max-width:760px}
  .fuss{position:absolute;left:84px;bottom:58px;font-size:21px;font-weight:700;color:#39d9f5;letter-spacing:.02em}
</style></head>
<body>
  <div class="netz"></div><div class="rahmen"></div>
  <div class="inhalt">
    <img src="assets/logo-cyan.png" alt="">
    <p class="augenbraue">KI · Automatisierung · Strategie</p>
    <h1>KI-Beratung und<br><span>Automatisierung für KMU</span></h1>
    <p>Persönlicher KI-Assistent, Prozessautomatisierung und digitale Strategie — verständlich erklärt, praxisnah umgesetzt.</p>
  </div>
  <div class="fuss">alphablueprint.de</div>
</body></html>
