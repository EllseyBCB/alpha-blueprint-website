<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(/assets/fonts/xn7gYHE41ni1AdIRggexSg.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-style:normal;font-weight:300 900;font-stretch:62% 125%;font-display:swap;src:url(/assets/fonts/neu/archivo-var.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url(/assets/fonts/neu/jetbrains-mono.woff2) format("woff2")}
:root{
  --grund:#f6f7f9; --karte:#ffffff; --karte2:#fafbfc; --linie:#e6e8ec; --linie2:#d5d9df;
  --text:#101828; --mittel:#344054; --leise:#667085; --hauch:#98a2b3;
  --akzent:#0b7c93; --akzent-hell:#e7f4f7; --akzent-tief:#08606f;
  --gut:#12805c; --gut-hell:#e8f5ef; --warn:#b54708; --warn-hell:#fef3e7; --schlecht:#c4320a; --schlecht-hell:#fdecea;
  --schrift:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --anzeige:"Archivo","Manrope",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --rk:10px;
  --schatten:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --schatten2:0 12px 32px -12px rgba(16,24,40,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--grund);color:var(--text);font:400 15.5px/1.6 var(--schrift);-webkit-font-smoothing:antialiased}
a{color:var(--akzent)}
h1,h2,h3{font-family:var(--anzeige);letter-spacing:-.01em;color:var(--text)}
button,.knopf{font:600 14px var(--schrift);cursor:pointer;border-radius:999px;padding:9px 16px;border:1px solid var(--linie2);
  background:var(--karte);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s}
button:hover,.knopf:hover{border-color:var(--hauch);background:var(--karte2)}
button:active,.knopf:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:default;transform:none}
button.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
button.haupt:hover{background:var(--akzent-tief)}
button.leise{border-color:transparent;background:transparent;color:var(--leise)}
button.leise:hover{background:var(--linie);color:var(--text)}
button.gefahr{color:var(--schlecht)}
button.klein,.knopf.klein{padding:6px 12px;font-size:13px}
input[type=text],input[type=password],input[type=date],input[type=number],textarea{font:400 15px/1.5 var(--schrift);color:var(--text);background:var(--karte);border:1px solid var(--linie2);
  border-radius:var(--rk);padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--akzent);box-shadow:0 0 0 3px var(--akzent-hell)}
textarea{resize:vertical;min-height:56px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mittel);cursor:pointer}
.marke{display:inline-flex;align-items:center;gap:10px;font:700 15px var(--schrift);color:var(--text);text-decoration:none}
.marke i{display:block;width:26px;height:23px;background:var(--text);-webkit-mask:url(/assets/neu/marke-a-hell.png) center/contain no-repeat;mask:url(/assets/neu/marke-a-hell.png) center/contain no-repeat}
.etikett{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
.leise{color:var(--leise)} .klein{font-size:13px}
.pille{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--linie);color:var(--mittel)}
.pille.gut{background:var(--gut-hell);color:var(--gut)} .pille.warn{background:var(--warn-hell);color:var(--warn)} .pille.akzent{background:var(--akzent-hell);color:var(--akzent)}
.zahlpunkt{min-width:20px;height:20px;border-radius:10px;background:var(--akzent);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.balken{height:6px;border-radius:3px;background:var(--linie);overflow:hidden}
.balken i{display:block;height:100%;background:var(--akzent);border-radius:3px;transition:width .4s}

/* ---------------- Anmeldung */
#tor{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(1200px 500px at 50% -10%,#e7f4f7 0,transparent 60%),var(--grund)}
#tor[hidden],#app[hidden]{display:none}
.tor{width:100%;max-width:400px;background:var(--karte);border:1px solid var(--linie);border-radius:20px;padding:32px 28px 24px;box-shadow:var(--schatten2)}
.tor h1{font-size:28px;line-height:1.15;margin:22px 0 6px}
.tor p.unter{color:var(--leise);margin:0 0 22px;font-size:14.5px}
.tor label{display:block;font-size:13px;font-weight:600;color:var(--mittel);margin:0 0 6px}
.tor input{margin-bottom:14px}
.tor button{width:100%;justify-content:center;padding:12px;margin-top:4px}
.tor .sagt{min-height:1.4em;margin:12px 0 0;font-size:14px;color:var(--leise)}
.tor .sagt.schlecht{color:var(--schlecht)}
.tor .fuss{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--linie);font-size:13px;color:var(--leise)}

/* ---------------- Gerüst */
.kopf{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--linie)}
.kopf .innen{max-width:1180px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
.kopf .firma{font-size:13.5px;color:var(--leise);padding-left:16px;border-left:1px solid var(--linie);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf .rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.kopf .wer{font-size:13px;color:var(--leise)}
.reiter{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.reiter::-webkit-scrollbar{display:none}
.reiter button{border:0;border-radius:0;background:none;padding:12px 12px 11px;color:var(--leise);font-weight:600;border-bottom:2px solid transparent}
.reiter button:hover{color:var(--text);background:none}
.reiter button[aria-current=true]{color:var(--text);border-bottom-color:var(--akzent)}
.rahmen{max-width:1180px;margin:0 auto;padding:30px 20px 80px}
.seitenkopf{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.seitenkopf h1{font-size:clamp(26px,3.4vw,34px);line-height:1.15;margin:6px 0 0}
.seitenkopf p{margin:6px 0 0;color:var(--leise);max-width:680px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--r);box-shadow:var(--schatten)}
.karte.pad{padding:20px 22px}
.raster{display:grid;gap:16px}
.raster.drei{grid-template-columns:repeat(3,minmax(0,1fr))}
.raster.zwei{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.karte h2{font-size:17px;margin:0 0 4px}
.karte .kartenkopf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.leer{color:var(--leise);font-size:14px;padding:18px;text-align:center}
.hinweis{display:flex;gap:10px;align-items:flex-start;background:var(--akzent-hell);border-radius:var(--rk);padding:12px 14px;font-size:14px;color:var(--mittel)}
.hinweis b{color:var(--text)}

/* Übersicht */
.held{display:flex;gap:26px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.held .zahl{font:700 40px/1 var(--anzeige);color:var(--text)}
.held .balken{width:min(360px,100%);height:8px;margin-top:10px}
.nachrichtvorschau{border-left:3px solid var(--linie);padding:4px 0 4px 12px;margin:8px 0;font-size:14px;color:var(--mittel)}
.nachrichtvorschau.admin{border-left-color:var(--akzent)}
.doczeile{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linie)}
.doczeile:first-child{border-top:0}
.docsymbol{flex:none;width:38px;height:44px;border-radius:7px;background:var(--akzent-hell);color:var(--akzent);display:flex;align-items:center;justify-content:center;font:600 10px var(--mono);letter-spacing:.04em}
.doczeile .titel{font-weight:650}
.doczeile .mehr{flex:1;min-width:0}
.doczeile .aktionen{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* Unterlagen */
.unterlagen{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.inhalt{position:sticky;top:130px}
.inhalt a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--mittel);font-size:14px}
.inhalt a:hover{background:var(--karte)}
.inhalt a .z{font:500 12px var(--mono);color:var(--hauch)}
.inhalt a.fertig .z{color:var(--gut)}
.abschnitt{margin-bottom:34px;scroll-margin-top:130px}
.abschnitt>.kopfzeile{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.abschnitt>.kopfzeile h2{font-size:20px;margin:0}
.punkt{padding:18px 20px;margin-bottom:10px}
.punkt .zeile1{display:flex;gap:12px;align-items:flex-start}
.status{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--linie2);margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.punkt.fertig .status{background:var(--gut);border-color:var(--gut)}
.punkt h3{font:650 16px/1.4 var(--schrift);margin:0}
.punkt .warum{color:var(--leise);font-size:14px;margin:4px 0 0}
.punkt .koerper{margin-left:34px}
.punkt ul.details{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--mittel)}
.punkt .feld{margin-top:12px;position:relative}
.punkt .gespeichert{position:absolute;right:10px;bottom:9px;font-size:12px;color:var(--hauch);pointer-events:none}
.werkzeuge{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dateien{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.dateien li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;background:var(--karte2);border:1px solid var(--linie);border-radius:8px;padding:7px 10px}
.dateien .n{font-weight:600;word-break:break-all;flex:1;min-width:120px}
.dateien .g{color:var(--hauch);font:400 12px var(--mono)}
.dateien .s{font-size:12.5px}
.s.ok{color:var(--gut)} .s.laeuft{color:var(--akzent)} .s.fehler{color:var(--schlecht)}
.dbalken{flex-basis:100%;height:3px;border-radius:2px;background:var(--linie);overflow:hidden}
.dbalken i{display:block;height:100%;background:var(--akzent)}

/* Nachrichten */
.verlauf{display:flex;flex-direction:column;gap:10px;max-height:min(62vh,640px);overflow-y:auto;padding:18px}
.blase{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.blase .von{display:block;font-size:11.5px;color:var(--hauch);margin-bottom:2px}
.blase.ich{align-self:flex-end;background:var(--akzent);color:#fff;border-bottom-right-radius:5px}
.blase.ich .von{color:rgba(255,255,255,.75)}
.blase.du{align-self:flex-start;background:var(--grund);border:1px solid var(--linie);border-bottom-left-radius:5px}
.schreiben{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--linie);padding:14px 18px}
.schreiben textarea{min-height:46px;max-height:200px}

/* Tabellen */
.tabelle{width:100%;border-collapse:collapse;font-size:14px}
.tabelle th{text-align:left;font-size:12px;font-weight:600;color:var(--leise);padding:10px 12px;border-bottom:1px solid var(--linie);background:var(--karte2)}
.tabelle td{padding:10px 12px;border-bottom:1px solid var(--linie);vertical-align:top;word-break:break-word}
.tabelle tr:last-child td{border-bottom:0}

/* Admin */
.verwaltung{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.kundenliste{padding:8px}
.kundenliste button{width:100%;justify-content:space-between;border:0;border-radius:9px;background:none;padding:10px 12px;text-align:left;white-space:normal}
.kundenliste button[aria-current=true]{background:var(--akzent-hell);color:var(--akzent-tief)}
.kundenliste .unter{display:block;font-size:12px;font-weight:500;color:var(--leise)}
.formular{display:grid;gap:10px}
.formular .reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dateiwahl{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--linie2);border-radius:var(--rk);padding:14px;background:var(--karte2);font-size:14px;color:var(--leise)}

#meldung{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:50;max-width:380px}
#meldung div{background:var(--text);color:#fff;border-radius:12px;padding:11px 15px;font-size:14px;box-shadow:var(--schatten2)}
#meldung div.fehler{background:var(--schlecht)}

@media (max-width:900px){
  .raster.drei,.raster.zwei{grid-template-columns:1fr}
  .unterlagen,.verwaltung{grid-template-columns:1fr}
  .inhalt{position:static;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .inhalt a{white-space:nowrap;background:var(--karte);border:1px solid var(--linie)}
  .kopf .firma{display:none}
}
@media (max-width:600px){
  .punkt{padding:16px}
  .punkt .koerper{margin-left:0}
  .blase{max-width:90%}
  .kopf .wer{display:none}
  .rahmen{padding:22px 16px 70px}
  .kopf .innen,.reiter{padding:0 16px}
}

/* ---------------- CRM */
.kennzahlen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kennzahl{padding:16px 18px}
.kennzahl .z{font:700 26px/1.1 var(--anzeige);margin-top:6px}
.kennzahl .u{font-size:13px;color:var(--leise)}
.werkzeugleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.werkzeugleiste input[type=text]{max-width:300px}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;border:1px solid var(--linie2);background:var(--karte);color:var(--mittel);cursor:pointer}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#fff}
.tabelle tr.klick{cursor:pointer}
.tabelle tr.klick:hover td{background:var(--karte2)}
.st-lead{background:#eef2f6;color:#475467} .st-angebot{background:var(--warn-hell);color:var(--warn)}
.st-kunde{background:var(--gut-hell);color:var(--gut)} .st-pausiert{background:#f2f0fb;color:#5b45b0} .st-verloren{background:var(--schlecht-hell);color:var(--schlecht)}
.felder{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.felder label{display:block;font-size:12.5px;font-weight:600;color:var(--mittel);margin-bottom:5px}
.felder .breit{grid-column:1/-1}
select{font:500 14.5px var(--schrift);color:var(--text);background:var(--karte);border:1px solid var(--linie2);border-radius:var(--rk);padding:9px 10px;outline:none}
.kontaktzeile{display:grid;grid-template-columns:1.2fr 1fr 1.3fr 1fr auto;gap:8px;margin-bottom:8px}
.ereignis{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linie)}
.ereignis:first-child{border-top:0}
.ereignis .icon{flex:none;width:32px;height:32px;border-radius:9px;background:var(--akzent-hell);color:var(--akzent);display:flex;align-items:center;justify-content:center;font-size:14px}
.ereignis .icon.nachricht{background:#eef2f6;color:#344054} .ereignis .icon.antwort{background:var(--gut-hell);color:var(--gut)}
.ereignis .was{flex:1;min-width:0;font-size:14px}
.ereignis .was .text{color:var(--mittel);white-space:pre-wrap;word-wrap:break-word}
.zeitleiste .eintrag{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linie)}
.zeitleiste .eintrag:first-child{border-top:0}
.zeitleiste .text{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
@media (max-width:900px){.kennzahlen{grid-template-columns:repeat(2,minmax(0,1fr))}.felder{grid-template-columns:1fr}.kontaktzeile{grid-template-columns:1fr 1fr}}

/* ---------------- Vorschau */
#vorschau{position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;padding:28px}
#vorschau[hidden]{display:none}
#vorschau .rahmen-v{flex:1;display:flex;flex-direction:column;background:var(--karte);border-radius:16px;overflow:hidden;box-shadow:var(--schatten2);max-width:1200px;margin:0 auto;width:100%}
#vorschau .kopf-v{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linie)}
#vorschau .kopf-v .name{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vorschau .inhalt-v{flex:1;min-height:0;overflow:auto;background:var(--grund);display:flex}
#vorschau iframe{border:0;width:100%;height:100%;background:#fff}
#vorschau img{max-width:100%;max-height:100%;margin:auto;object-fit:contain}
#vorschau video{max-width:100%;max-height:100%;margin:auto}
#vorschau audio{margin:auto;width:min(520px,90%)}
#vorschau pre{margin:0;padding:18px 20px;font:13px/1.55 var(--mono);white-space:pre-wrap;word-wrap:break-word;width:100%;background:var(--karte)}
#vorschau .ohne{margin:auto;text-align:center;padding:30px;color:var(--mittel);max-width:440px}
#vorschau table{border-collapse:collapse;font-size:13px;background:var(--karte);margin:0;align-self:flex-start}
#vorschau td,#vorschau th{border:1px solid var(--linie);padding:5px 8px;white-space:nowrap}
#vorschau th{background:var(--karte2);position:sticky;top:0}
@media (max-width:600px){#vorschau{padding:0}#vorschau .rahmen-v{border-radius:0}}

/* ---------------- Logo groß, QR, Anmeldung */
.marke.gross{font-size:19px;gap:13px}
.marke.gross i{width:40px;height:35px}
.qr{background:#fff;border-radius:14px;padding:10px;width:220px;max-width:100%;margin:6px 0 4px;border:1px solid var(--linie)}
.qr svg{display:block;width:100%;height:auto}
.thema{font-size:16px;min-width:34px;justify-content:center}

/* ---------------- Finanzen: Ist / Könnte, Diagramm */
.zustaende{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:6px}
.zustand{border:1px solid var(--linie);border-radius:var(--r);padding:16px 18px;background:var(--karte2)}
.zustand.koennte{border-style:dashed}
.minizahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linie)}
.diagramm{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.diagramm .gitter{stroke:var(--linie);stroke-width:1}
.diagramm .null{stroke:var(--schlecht);stroke-width:1;stroke-dasharray:4 4}
.diagramm .b-ein{fill:var(--akzent)}
.diagramm .b-koennte{fill:var(--akzent);opacity:.28}
.diagramm .b-fix{fill:var(--linie2)}
.diagramm .l-ist{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.diagramm .l-ist-p{fill:var(--karte);stroke:var(--text);stroke-width:2.5}
.diagramm .l-koennte{fill:none;stroke:var(--akzent);stroke-width:2.5;stroke-dasharray:7 6;stroke-linejoin:round}
.diagramm .l-koennte-p{fill:var(--karte);stroke:var(--akzent);stroke-width:2}
.diagramm text{font:500 15px var(--schrift);fill:var(--leise)}
.diagramm .wert{font-weight:700;fill:var(--text)}
.diagramm .wert.koennte{fill:var(--akzent)}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--leise);align-items:center}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:-8px;vertical-align:-1px}
.legende .lg-ein{background:var(--akzent)} .legende .lg-koennte{background:var(--akzent);opacity:.28} .legende .lg-fix{background:var(--linie2)}
.diagramm .treffer{fill:none;stroke:transparent;stroke-width:18;cursor:pointer;pointer-events:stroke}
.diagramm rect[data-linie]{cursor:pointer}
.legende [data-linie]{cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.legende [data-linie] i{margin-right:0}
.linieninfo{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:8px;padding:12px 14px;border:1px solid var(--linie);border-radius:12px;background:var(--karte2)}
.legende .lg-linie{height:3px;border-radius:2px;background:var(--text)} .legende .lg-linie2{height:0;border-top:3px dashed var(--akzent);border-radius:0}
.feedknoepfe{display:flex;gap:4px;flex:none;align-items:flex-start}
@media (max-width:900px){.zustaende{grid-template-columns:1fr}}

/* ================================================================ CRM: Liquid Glass + Hell/Dunkel
   Gilt nur für das CRM (html[data-app=crm]); das Kundenportal bleibt schlicht hell. */
html[data-glas]{
  --glas:rgba(255,255,255,.58); --glas2:rgba(255,255,255,.42); --glaskante:rgba(255,255,255,.75); --glasschatten:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px -12px rgba(16,24,40,.22),0 1px 3px rgba(16,24,40,.06);
  --grund:#e9eef3;
}
html[data-glas] body{background:
  radial-gradient(900px 600px at 8% -5%,rgba(11,124,147,.20),transparent 60%),
  radial-gradient(800px 600px at 95% 10%,rgba(124,92,255,.14),transparent 60%),
  radial-gradient(900px 700px at 60% 110%,rgba(18,128,92,.12),transparent 60%),
  var(--grund);background-attachment:fixed;min-height:100vh}
html[data-glas] .karte,html[data-glas] .tor{background:var(--glas);border:1px solid var(--glaskante);box-shadow:var(--glasschatten);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
html[data-glas] .kopf{background:var(--glas2);border-bottom:1px solid var(--glaskante);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
html[data-glas] .zustand{background:var(--glas2);border-color:var(--glaskante)}
html[data-glas] button:not(.haupt):not(.leise),html[data-glas] .knopf,html[data-glas] .chip:not([aria-pressed=true]){background:var(--glas2);border-color:var(--glaskante);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
html[data-glas] button.haupt{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px -6px rgba(11,124,147,.6)}
html[data-glas] input[type=text],html[data-glas] input[type=password],html[data-glas] input[type=date],html[data-glas] input[type=number],html[data-glas] textarea,html[data-glas] select{background:rgba(255,255,255,.55);border-color:var(--glaskante)}
html[data-glas] .tabelle th{background:transparent}
html[data-glas] .dateien li,html[data-glas] .inhalt a:hover{background:var(--glas2)}
html[data-glas] #tor{background:transparent}

/* Dunkel: per Schalter, oder „System“ und das Gerät steht auf dunkel. */
html[data-glas][data-thema="dunkel"]{color-scheme:dark;
  --grund:#070b12; --karte:#111826; --karte2:rgba(255,255,255,.04); --linie:rgba(255,255,255,.09); --linie2:rgba(255,255,255,.18);
  --text:#eef2f7; --mittel:#c3cbd6; --leise:#8d98a8; --hauch:#6b7685;
  --akzent:#4cc9de; --akzent-hell:rgba(76,201,222,.14); --akzent-tief:#7fdbea;
  --gut:#4ad89a; --gut-hell:rgba(74,216,154,.14); --warn:#f5b04c; --warn-hell:rgba(245,176,76,.14); --schlecht:#ff7a66; --schlecht-hell:rgba(255,122,102,.14);
  --glas:rgba(22,30,44,.55); --glas2:rgba(255,255,255,.05); --glaskante:rgba(255,255,255,.10);
  --glasschatten:0 1px 0 rgba(255,255,255,.07) inset,0 18px 40px -16px rgba(0,0,0,.7)}
@media (prefers-color-scheme:dark){html[data-glas][data-thema="system"]{color-scheme:dark;
  --grund:#070b12; --karte:#111826; --karte2:rgba(255,255,255,.04); --linie:rgba(255,255,255,.09); --linie2:rgba(255,255,255,.18);
  --text:#eef2f7; --mittel:#c3cbd6; --leise:#8d98a8; --hauch:#6b7685;
  --akzent:#4cc9de; --akzent-hell:rgba(76,201,222,.14); --akzent-tief:#7fdbea;
  --gut:#4ad89a; --gut-hell:rgba(74,216,154,.14); --warn:#f5b04c; --warn-hell:rgba(245,176,76,.14); --schlecht:#ff7a66; --schlecht-hell:rgba(255,122,102,.14);
  --glas:rgba(22,30,44,.55); --glas2:rgba(255,255,255,.05); --glaskante:rgba(255,255,255,.10);
  --glasschatten:0 1px 0 rgba(255,255,255,.07) inset,0 18px 40px -16px rgba(0,0,0,.7)}}
html[data-glas][data-thema="dunkel"] body{background:radial-gradient(900px 600px at 8% -5%,rgba(76,201,222,.16),transparent 60%),radial-gradient(800px 600px at 95% 10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(900px 700px at 60% 110%,rgba(74,216,154,.08),transparent 60%),var(--grund);background-attachment:fixed}
@media (prefers-color-scheme:dark){html[data-glas][data-thema="system"] body{background:radial-gradient(900px 600px at 8% -5%,rgba(76,201,222,.16),transparent 60%),radial-gradient(800px 600px at 95% 10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(900px 700px at 60% 110%,rgba(74,216,154,.08),transparent 60%),var(--grund);background-attachment:fixed}}
html[data-glas][data-thema="dunkel"] input,html[data-glas][data-thema="dunkel"] textarea,html[data-glas][data-thema="dunkel"] select{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){html[data-glas][data-thema="system"] input,html[data-glas][data-thema="system"] textarea,html[data-glas][data-thema="system"] select{background:rgba(255,255,255,.06)}}
html[data-glas][data-thema="dunkel"] .marke i,html[data-glas][data-thema="dunkel"] .marke{color:var(--text)}
html[data-glas] .marke i{background:currentColor}
html[data-glas] .chip[aria-pressed=true]{background:var(--text);color:var(--grund)}
html[data-glas] button.haupt{color:#fff}
html[data-glas][data-thema="dunkel"] button.haupt{color:#04141a}
@media (prefers-color-scheme:dark){html[data-glas][data-thema="system"] button.haupt{color:#04141a}}
html[data-glas][data-thema="dunkel"] #meldung div{background:#1d2738}
@media (prefers-color-scheme:dark){html[data-glas][data-thema="system"] #meldung div{background:#1d2738}}
/* Reiter und Kundenliste ohne Glas-Kasten: Unterstrich wie gehabt. */
html[data-glas] .reiter button,html[data-glas] .kundenliste button{background:none !important;border-color:transparent !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;box-shadow:none}
html[data-glas] .reiter button[aria-current=true]{border-bottom-color:var(--akzent) !important}

.feldraster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:end;padding:14px 20px 18px;border-top:1px solid var(--linie)}
.feldraster .breit{grid-column:1/-1}
.feldraster label{display:block;font-size:12.5px;font-weight:600;color:var(--leise);margin-bottom:4px}
.feldraster.vier{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:760px){.feldraster.vier{grid-template-columns:repeat(2,minmax(0,1fr))}.feldraster.vier>div:first-child{grid-column:1/-1}}
@media (max-width:520px){.feldraster,.feldraster.vier{grid-template-columns:1fr}}
/* Darstellungsschalter im Kundenportal: unten rechts, auf Anmeldung und Seite. */
.themaknopf{position:fixed;right:16px;bottom:16px;z-index:50;width:42px;height:42px;border-radius:50%;padding:0;font-size:18px;line-height:1}

/* Kundenzugänge (CRM-Einstellungen) */
.feldraster select{width:100%;min-width:0;text-overflow:ellipsis}
.zg-liste{border-top:1px solid var(--linie)}
.zg-zeile{padding:12px 20px;border-bottom:1px solid var(--linie)}
.zg-kopf{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) auto;gap:12px;align-items:center}
.zg-weg{text-align:right}
.zg-pw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--karte2);border:1px solid var(--linie)}
.zg-pw input{flex:1 1 200px;width:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.zg-code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;padding:3px 8px;border-radius:8px;background:var(--akzent-hell);user-select:all}
.zg-neu{grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,1fr) auto}
@media (max-width:860px){.zg-neu{grid-template-columns:repeat(2,minmax(0,1fr))}.zg-kopf{grid-template-columns:1fr auto}.zg-stand{grid-column:1/-1;grid-row:2}}
@media (max-width:520px){.zg-neu{grid-template-columns:1fr}}

/* Anmeldung: Passwort anzeigen */
.pwfeld{position:relative}
.pwfeld input{padding-right:46px}
.pwauge{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;border:0 !important;background:none !important;box-shadow:none !important;opacity:.55;font-size:16px;line-height:1;-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.tor .pwfeld{margin-bottom:14px}.tor .pwfeld input{margin-bottom:0}

/* ===================================================================== Vorschau
 * Jeder Link auf eine Datei im Speicher öffnet sich hier über der Seite statt als Download.
 * PDF, Bilder, Text/CSV, Audio, Video lassen sich anzeigen. Word/Excel/PowerPoint kann
 * ein Browser nicht selbst darstellen; ein Online-Betrachter (Microsoft, Google) würde
 * die Kundendatei an Dritte geben, also gibt es dort nur Herunterladen.
 * Cmd/Strg-Klick öffnet wie gewohnt einen neuen Tab.
 */
function dateinameAusLink(url) {
  try { return decodeURIComponent(new URL(url).pathname.split("/").pop()).replace(/^\d{8}-\d{6}-/, ""); } catch (e) { return "Datei"; }
}
function vorschauArt(name) {
  var e = (/\.([a-z0-9]{1,5})$/i.exec(name || "") || [0, ""])[1].toLowerCase();
  if (e === "pdf") return "pdf";
  if (["png", "jpg", "jpeg", "gif", "webp", "svg", "heic", "bmp"].indexOf(e) !== -1) return e === "heic" ? "ohne" : "bild";
  if (["txt", "md", "json", "log", "xml", "rtf"].indexOf(e) !== -1) return "text";
  if (e === "csv" || e === "tsv") return "csv";
  if (["mp3", "m4a", "wav", "aac", "ogg"].indexOf(e) !== -1) return "audio";
  if (["mp4", "mov", "webm"].indexOf(e) !== -1) return "video";
  return "ohne";
}
function csvTabelle(t) {
  var zeilen = t.replace(/^\ufeff/, "").split(/\r?\n/).filter(function (z) { return z.trim(); }).slice(0, 2000);
  if (!zeilen.length) return "<pre>(leer)</pre>";
  var trenn = [";", "\t", ","].map(function (k) { return [k, zeilen[0].split(k).length]; }).sort(function (a, b) { return b[1] - a[1]; })[0][0];
  return "<table>" + zeilen.map(function (z, i) { var c = i ? "td" : "th"; return "<tr>" + z.split(trenn).map(function (x) { return "<" + c + ">" + esc(x.replace(/^"|"$/g, "")) + "</" + c + ">"; }).join("") + "</tr>"; }).join("") + "</table>";
}
function vorschauOeffnen(url, name) {
  var v = document.getElementById("vorschau");
  if (!v) { v = document.createElement("div"); v.id = "vorschau"; v.hidden = true; document.body.appendChild(v); }
  name = name || dateinameAusLink(url);
  var art = vorschauArt(name), laden = url + (url.indexOf("?") === -1 ? "?" : "&") + "download=" + encodeURIComponent(name);
  var inhalt = art === "pdf" ? '<iframe src="' + esc(url) + '#view=FitH" title="' + esc(name) + '"></iframe>'
    : art === "bild" ? '<img src="' + esc(url) + '" alt="' + esc(name) + '">'
    : art === "audio" ? '<audio controls autoplay src="' + esc(url) + '"></audio>'
    : art === "video" ? '<video controls src="' + esc(url) + '"></video>'
    : art === "text" || art === "csv" ? '<pre>Lädt …</pre>'
    : '<div class="ohne"><div style="font-size:34px;margin-bottom:8px">📄</div><b>' + esc(name) + '</b><p>Diese Dateiart kann der Browser nicht selbst anzeigen. Bitte herunterladen und mit Word, Excel oder dem passenden Programm öffnen.</p><a class="knopf haupt" href="' + esc(laden) + '">Herunterladen</a></div>';
  v.innerHTML = '<div class="rahmen-v" role="dialog" aria-modal="true" aria-label="' + esc(name) + '"><div class="kopf-v"><span class="name">' + esc(name) + '</span>' +
    '<a class="knopf klein" href="' + esc(laden) + '">Herunterladen</a><a class="knopf klein" href="' + esc(url) + '" target="_blank" rel="noopener">In neuem Tab</a>' +
    '<button type="button" class="klein" data-vorschauzu>Schließen</button></div><div class="inhalt-v">' + inhalt + "</div></div>";
  v.hidden = false; document.body.style.overflow = "hidden";
  v.querySelector("[data-vorschauzu]").onclick = vorschauZu;
  v.onclick = function (ev) { if (ev.target === v) vorschauZu(); };
  if (art === "text" || art === "csv") {
    fetch(url).then(function (r) { return r.text(); }).then(function (t) {
      var ziel = v.querySelector(".inhalt-v"); if (!ziel) return;
      ziel.innerHTML = art === "csv" ? csvTabelle(t) : "<pre>" + esc(t.slice(0, 500000)) + "</pre>";
    }, function () { var p = v.querySelector("pre"); if (p) p.textContent = "Die Datei ließ sich nicht laden."; });
  }
}
function vorschauZu() { var v = document.getElementById("vorschau"); if (v) { v.hidden = true; v.innerHTML = ""; } document.body.style.overflow = ""; }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") vorschauZu(); });

  var a = e.target.closest && e.target.closest('a[href*="/storage/v1/object/sign/"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || /[?&]download=/.test(a.href) || a.closest("#vorschau")) return;

/* ===================================================================== Handeln */
var speichernUhr = {};
function antwortSpeichern(punkt) {
  clearTimeout(speichernUhr[punkt]);
  speichernUhr[punkt] = setTimeout(function () {
    var g = document.querySelector('[data-gesp="' + punkt + '"]'); if (g) g.textContent = "speichert …";
    api("antwort", { punkt: punkt, text: S.entwurf.antworten[punkt] || "" }).then(function () {
      var a = S.stand.antworten.filter(function (x) { return x.punkt === punkt; })[0];
      if (a) a.text = S.entwurf.antworten[punkt]; else S.stand.antworten.push({ punkt: punkt, text: S.entwurf.antworten[punkt] });
      var g2 = document.querySelector('[data-gesp="' + punkt + '"]'); if (g2) g2.textContent = "✓ gespeichert";
    }, function (f) { var g3 = document.querySelector('[data-gesp="' + punkt + '"]'); if (g3) g3.textContent = "nicht gespeichert"; melden(f.message, true); });
  }, 900);
}
function dateienHoch(punkt, liste) {
  Array.prototype.forEach.call(liste, function (datei) {
    var u = { id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), punkt: punkt, name: datei.name, groesse: datei.size, anteil: 0, stand: "laeuft" };
    S.uploads.push(u);
    if (datei.size > DATEI_MAX) { u.stand = "fehler"; u.grund = "zu groß (höchstens 50 MB)"; return; }
    api("hochladen", { punkt: punkt, name: datei.name }).then(function (l) {
      return hochladen(l.url, datei, function (x) { u.anteil = x; var b = document.querySelector('[data-upload="' + u.id + '"] .dbalken i'); if (b) b.style.width = Math.round(x * 100) + "%"; });
    }).then(function () {
      S.uploads = S.uploads.filter(function (x) { return x !== u; }); melden("„" + datei.name + "“ ist angekommen."); laden(true);
    }, function (f) { u.stand = "fehler"; u.grund = f.message; zeichnen(); });
  });
  zeichnen();
}
function vorlageHolen(name) {
  /* Die Links gelten 30 Minuten, also vor dem Herunterladen frisch holen. */
  api("inhalt").then(function (j) {
    var v = j.kunde && j.kunde.vorlagenLinks && j.kunde.vorlagenLinks[name];
    if (!v || !v.url) throw new Error("Die Vorlage ist gerade nicht verfügbar.");
    var a = document.createElement("a"); a.href = v.url; a.download = v.name; document.body.appendChild(a); a.click(); a.remove();
  }).catch(function (f) { melden(f.message, true); });
}
var TUN = {
  abmelden: function () { abmeldenUeberall(); },
  einstellungen: function () { S.sicht = "einstellungen"; zeichnen(); window.scrollTo(0, 0); },
  senden: function (b) {
    var t = S.entwurf.nachricht.trim(); if (!t) return;
    b.disabled = true;
    api("nachricht", { text: t }).then(function (j) { S.entwurf.nachricht = ""; S.stand.nachrichten.push(j.nachricht); zeichnen(); var f = document.querySelector('[data-entwurf="nachricht"]'); if (f) f.focus(); },
      function (f) { b.disabled = false; melden(f.message, true); });
  },
  dateiWaehlen: function () { document.getElementById("bereitDatei").click(); },
  rueckgabe: function (b) { S.entwurf.rueckgabe = b.checked; },
  bereitstellen: function (b) {
    var d = S.datei; if (!d) return;
    if (d.size > DATEI_MAX) return melden("Höchstens 50 MB je Datei.", true);
    b.disabled = true; b.textContent = "Wird hochgeladen …";
    api("bereitstellen", { name: d.name }).then(function (l) {
      return hochladen(l.url, d).then(function () {
        return api("bereitgestellt", { pfad: l.pfad, titel: S.entwurf.titel || d.name.replace(/\.[^.]+$/, ""), notiz: S.entwurf.notiz, rueckgabe: S.entwurf.rueckgabe, dateiname: d.name, groesse: d.size });
      });
    }).then(function () {
      melden("Bereitgestellt. Der Kunde sieht es jetzt unter „Dokumente“.");
      S.datei = null; S.entwurf.titel = ""; S.entwurf.notiz = ""; S.entwurf.rueckgabe = false; laden(true);
    }, function (f) { melden(f.message, true); zeichnen(); });
  },
};
function verdrahten() {
  var w = document.getElementById("app");
  w.querySelectorAll("[data-tun]").forEach(function (b) {
    if (b.type === "checkbox") b.onchange = function () { TUN[b.dataset.tun](b); };
    else b.onclick = function () { TUN[b.dataset.tun](b); };
  });
  w.querySelectorAll("[data-sicht]").forEach(function (b) { b.onclick = function () { S.sicht = b.dataset.sicht; S.bestaetigen = null; zeichnen(); window.scrollTo(0, 0); }; });
  w.querySelectorAll("[data-gehe]").forEach(function (b) { b.onclick = function () { S.sicht = "unterlagen"; zeichnen(); var z = document.getElementById("abschnitt-" + b.dataset.gehe); if (z) z.scrollIntoView(); }; });
  w.querySelectorAll("[data-kunde]").forEach(function (b) { b.onclick = function () { S.kunde = b.dataset.kunde; S.stand = null; S.sicht = "nachrichten"; S.bestaetigen = null; laden(); uebersichtLaden(); }; });
  w.querySelectorAll("[data-antwort]").forEach(function (t) {
    t.oninput = function () {
      var p = t.dataset.antwort; S.entwurf.antworten[p] = t.value;
      var k = t.closest(".punkt"); if (k) k.classList.toggle("fertig", fertig(p));
      var g = document.querySelector('[data-gesp="' + p + '"]'); if (g) g.textContent = "";
      antwortSpeichern(p);
    };
  });
  w.querySelectorAll("[data-entwurf]").forEach(function (t) {
    t.oninput = function () { S.entwurf[t.dataset.entwurf] = t.value; };
    if (t.dataset.entwurf === "nachricht") t.onkeydown = function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); TUN.senden(w.querySelector('[data-tun="senden"]')); } };
  });
  w.querySelectorAll("[data-waehlen]").forEach(function (b) {
    var i = w.querySelector('[data-eingabe="' + b.dataset.waehlen + '"]');
    b.onclick = function () { i.click(); };
    i.onchange = function () { dateienHoch(i.dataset.eingabe, i.files); i.value = ""; };
  });
  w.querySelectorAll("[data-vorlage]").forEach(function (b) { b.onclick = function () { vorlageHolen(b.dataset.vorlage); }; });
  w.querySelectorAll("[data-weg]").forEach(function (b) { b.onclick = function () { S.uploads = S.uploads.filter(function (u) { return u.id !== b.dataset.weg; }); zeichnen(); }; });
  w.querySelectorAll("[data-zurueckfrage]").forEach(function (b) { b.onclick = function () { S.bestaetigen = b.dataset.zurueckfrage; zeichnen(); setTimeout(function () { if (S.bestaetigen === b.dataset.zurueckfrage) { S.bestaetigen = null; zeichnen(); } }, 5000); }; });
  w.querySelectorAll("[data-zurueck]").forEach(function (b) { b.onclick = function () {
    b.disabled = true; api("zurueckziehen", { id: b.dataset.zurueck }).then(function () { S.bestaetigen = null; melden("Zurückgezogen."); laden(true); }, function (f) { melden(f.message, true); }); }; });
  sicherheitVerdrahten();
  var bd = document.getElementById("bereitDatei");
  if (bd) bd.onchange = function () { S.datei = bd.files[0] || null; if (S.datei && !S.entwurf.titel) S.entwurf.titel = S.datei.name.replace(/\.[^.]+$/, ""); zeichnen(); };
}

/* ===================================================================== Start */
function starten(P) {
  S.P = P; S.admin = P.art === "admin";
  document.title = S.admin ? "Kundenportal · Verwaltung" : "Kundenportal · " + P.kunde.kurzname;
  if (S.admin) { S.sicht = "nachrichten"; zeichnen(); uebersichtLaden(); if (P.kunden.length === 1) { S.kunde = P.kunden[0].kennung; laden(); } }
  else { zeichnen(); laden(); }
  /* Neue Nachrichten und Dateien ohne Neuladen: alle 30 Sekunden, solange das Fenster sichtbar ist. */
  setInterval(function () {
    if (document.hidden || S.uploads.some(function (u) { return u.stand === "laeuft"; })) return;
    laden(true); if (S.admin) uebersichtLaden();
  }, 30000);
  window.addEventListener("beforeunload", function (e) { if (S.uploads.some(function (u) { return u.stand === "laeuft"; })) { e.preventDefault(); e.returnValue = ""; } });
}
</script>
