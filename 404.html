<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seite nicht gefunden (404) | Alpha Blueprint</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/png" href="/assets/logo-cyan.png">
  <meta name="theme-color" content="#05090e">
  <link rel="preload" href="/assets/fonts/xn7gYHE41ni1AdIRggexSg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/enhance.css">
  <style>
    .nf-wrap {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center;
      padding: 40px 20px; background: radial-gradient(720px circle at 50% 18%, rgba(57, 217, 245, .16), transparent 62%), var(--white, #05090e);
      color: var(--ink, #e6f3f9);
    }
    .nf-inner { max-width: 560px; }
    .nf-inner .nf-code {
      font-size: clamp(5rem, 18vw, 9rem); font-weight: 800; line-height: 1; letter-spacing: -.04em; margin: 0;
      background: var(--grad, linear-gradient(135deg, #c7f2fb, #14607a));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nf-inner h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); margin: 10px 0 14px; }
    .nf-inner p:not(.nf-code) { color: var(--muted, #8aa3b2); font-size: 1.05rem; line-height: 1.6; margin-bottom: 28px; }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .nf-btn { padding: 13px 26px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .nf-btn-solid { background: linear-gradient(160deg, #a8ecfa, #39d9f5 48%, #1a7d96); color: #04121a; }
    .nf-btn-ghost { border: 1px solid rgba(57, 217, 245, .5); color: var(--primary-hell, #a8ecfa); }
    .nf-logo { width: 84px; height: 84px; object-fit: contain; margin: 0 auto 24px; border-radius: 18px; background: rgba(57, 217, 245, .1); padding: 8px; }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div class="nf-inner">
      <img class="nf-logo" src="/assets/logo-cyan.png" width="84" height="84" alt="Alpha Blueprint">
      <p class="nf-code">404</p>
      <h1>Diese Seite gibt es leider nicht</h1>
      <p>Die aufgerufene Seite wurde verschoben oder existiert nicht mehr. Kein Problem – kehren Sie einfach zur Startseite zurück oder vereinbaren Sie direkt ein kostenloses Erstgespräch.</p>
      <div class="nf-actions">
        <a class="nf-btn nf-btn-solid" href="/">Zur Startseite</a>
        <a class="nf-btn nf-btn-ghost" href="/index.html#kontakt">Erstgespräch vereinbaren</a>
      </div>
    </div>
  </main>
</body>
</html>
